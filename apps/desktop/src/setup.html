<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:" />
<title>Bluebird</title>
<style>
  :root { color-scheme: light dark; --ink: #1b1d22; --soft: #6b7280; --line: rgba(0,0,0,.1); --accent: #2f6fd6; --bg: #f7f8fa; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9aa2; --line: rgba(255,255,255,.12); --bg: #1b1b1d; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 64px 56px 40px; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; -webkit-user-select: none; user-select: none; -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .brand img { width: 64px; height: 64px; flex: none; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p.sub { margin: 2px 0 0; color: var(--soft); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; }
  li { display: grid; grid-template-columns: 22px 1fr; gap: 14px; align-items: start; }
  .icon { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 1.6px solid var(--line); }
  li[data-state="working"] .icon { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  li[data-state="done"] .icon { background: var(--accent); border-color: var(--accent); position: relative; }
  li[data-state="done"] .icon::after { content: ""; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(40deg); }
  li[data-state="error"] .icon { border-color: #c0392b; background: #c0392b; }
  li small { display: block; margin-top: 2px; color: var(--soft); font-size: 13px; line-height: 1.5; }
  li[data-state="pending"] { opacity: .5; }
  .bar { height: 4px; margin-top: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .choices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; -webkit-app-region: no-drag; }
  .choices:empty { display: none; }
  button { font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="brand">
  <img src="logo.png" alt="" />
  <div>
    <h1>Setting up Bluebird</h1>
    <p class="sub" id="sub">Only the first time. Everything stays on this computer.</p>
  </div>
</div>
<ul id="steps"></ul>
<script>
  const list = document.getElementById("steps");
  const rows = new Map();
  function row(id) {
    if (rows.has(id)) return rows.get(id);
    const li = document.createElement("li");
    li.innerHTML = '<span class="icon"></span><div><strong></strong><small></small><div class="bar" hidden><i></i></div><div class="choices"></div></div>';
    list.appendChild(li);
    rows.set(id, li);
    return li;
  }
  window.setup.onUpdate((step) => {
    const li = row(step.id);
    li.dataset.state = step.state;
    li.querySelector("strong").textContent = step.title;
    li.querySelector("small").textContent = step.detail || "";
    const bar = li.querySelector(".bar");
    bar.hidden = typeof step.progress !== "number";
    if (!bar.hidden) bar.firstElementChild.style.width = Math.round(step.progress * 100) + "%";
    const choices = li.querySelector(".choices");
    choices.textContent = "";
    for (const choice of step.choices || []) {
      const button = document.createElement("button");
      button.textContent = choice.label;
      if (choice.primary) button.className = "primary";
      button.onclick = () => window.setup.choose({ step: step.id, value: choice.value });
      choices.appendChild(button);
    }
  });
</script>
</body>
</html>
